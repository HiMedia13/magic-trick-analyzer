<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마술 영상 분석기 🃏🪙</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --line:#2b2f3a; --txt:#e6e8ee;
          --mut:#9aa3b2; --accent:#e23b3b; --ok:#3bbf6a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:"Segoe UI",system-ui,sans-serif; line-height:1.5; }
  .wrap { max-width:920px; margin:0 auto; padding:24px 16px 64px; }
  h1 { font-size:1.6rem; margin:.2em 0; }
  .mut { color:var(--mut); font-size:.9rem; }
  .card { background:var(--card); border:1px solid var(--line);
          border-radius:12px; padding:18px; margin:16px 0; }
  label { display:block; font-size:.85rem; color:var(--mut); margin:10px 0 4px; }
  input[type=text], input[type=file] { width:100%; padding:10px;
          background:#0d0f14; border:1px solid var(--line); border-radius:8px;
          color:var(--txt); }
  .row { display:flex; gap:18px; flex-wrap:wrap; align-items:center; }
  .row > div { flex:1; min-width:220px; }
  .opts { display:flex; gap:20px; flex-wrap:wrap; margin-top:8px; }
  .opts label { display:flex; align-items:center; gap:6px; color:var(--txt);
                margin:0; cursor:pointer; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px;
           padding:12px 22px; font-size:1rem; cursor:pointer; margin-top:14px; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .seg { border:1px solid var(--line); border-radius:10px; padding:12px 14px;
         margin:10px 0; background:#13161d; }
  .seg .head { display:flex; justify-content:space-between; font-weight:600; }
  .badges { margin:6px 0; }
  .badge { display:inline-block; font-size:.72rem; padding:2px 8px; border-radius:99px;
           background:#2a1414; color:#ff9c9c; border:1px solid #4a2020; margin:2px 4px 2px 0; }
  .infer { margin-top:8px; padding:10px; background:#101820; border-left:3px solid var(--ok);
           border-radius:6px; font-size:.92rem; }
  .gallery { display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:10px; }
  .gallery figure { margin:0; }
  .gallery img { width:100%; border-radius:8px; border:1px solid var(--line); }
  .gallery figcaption { font-size:.75rem; color:var(--mut); text-align:center; margin-top:4px; }
  video { width:100%; border-radius:10px; border:1px solid var(--line); }
  #status { display:none; }
  .spin { display:inline-block; width:16px; height:16px; border:3px solid var(--line);
          border-top-color:var(--accent); border-radius:50%; animation:s 1s linear infinite;
          vertical-align:middle; margin-right:8px; }
  @keyframes s { to { transform:rotate(360deg); } }
  pre.log { background:#0a0c10; padding:10px; border-radius:8px; max-height:160px;
            overflow:auto; font-size:.78rem; color:var(--mut); white-space:pre-wrap; }
  .warn { font-size:.82rem; color:var(--mut); border-left:3px solid var(--accent);
          padding-left:10px; }
  .labeler-wrap { margin-top:8px; padding-top:8px;
                  border-top:1px dashed var(--line); }
  .labeler-wrap > summary { list-style:none; cursor:pointer; color:var(--mut);
                  font-size:.82rem; user-select:none; padding:2px 0;
                  display:inline-flex; align-items:center; gap:6px; }
  .labeler-wrap > summary::-webkit-details-marker { display:none; }
  .labeler-wrap > summary::before { content:'＋'; font-size:.85rem;
                  display:inline-block; width:14px; transition:transform .15s; }
  .labeler-wrap[open] > summary::before { content:'－'; }
  .labeler-wrap > summary:hover { color:var(--txt); }
  .labeler-wrap.registered > summary { color:var(--ok); }
  .labeler { display:flex; gap:6px; align-items:center; margin-top:6px;
             flex-wrap:wrap; }
  .labeler select, .labeler input[type=text] { background:#0d0f14;
          border:1px solid var(--line); border-radius:6px; color:var(--txt);
          padding:6px 8px; font-size:.85rem; }
  .labeler button { margin:0; padding:6px 12px; font-size:.85rem; }
  .labeler .ok { color:var(--ok); font-size:.85rem; }
  .labeler .err { color:#ff9c9c; font-size:.85rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🃏🪙 마술 영상 분석기</h1>
  <p class="warn">손을 추적해 <b>'수상한 순간'</b>(팜·전달·급동작·주먹쥠)을 타임라인으로 짚어줍니다.
     비밀을 확정하는 게 아니라 통계적으로 의심스러운 구간을 보조적으로 찾아줍니다.</p>

  <div class="card">
    <form id="form">
      <label>YouTube URL</label>
      <input type="text" name="url" id="url" placeholder="https://youtu.be/...">
      <label>또는 영상 파일 업로드 (mp4/mov)</label>
      <input type="file" name="file" id="file" accept="video/*">
      <div class="row" style="margin-top:8px">
        <div>
          <label>마술 종류 (중복 선택 가능, 자동이면 영상 보고 판별)</label>
          <div class="opts">
            <label><input type="checkbox" name="mode" value="auto" id="m_auto"> 🔮 자동 감지</label>
            <label><input type="checkbox" name="mode" value="card" checked> 🃏 카드</label>
            <label><input type="checkbox" name="mode" value="coin"> 🪙 동전</label>
          </div>
        </div>
        <div>
          <label>옵션</label>
          <div class="opts">
            <label><input type="checkbox" name="annotate" id="annotate" checked> 마킹 영상</label>
            <label><input type="checkbox" name="llm" id="llm"> AI 설명(OpenAI)</label>
          </div>
        </div>
      </div>
      <button type="submit" id="go">분석 시작</button>
    </form>
  </div>

  <div class="card" id="status">
    <div><span class="spin"></span><b id="statusText">분석 중…</b></div>
    <p class="mut">긴 영상은 손 추적에 수십 초~수 분 걸립니다. 창을 닫지 마세요.</p>
    <pre class="log" id="log"></pre>
  </div>

  <div id="results"></div>
</div>

<script>
const form = document.getElementById('form');
const statusBox = document.getElementById('status');
const statusText = document.getElementById('statusText');
const logEl = document.getElementById('log');
const resultsEl = document.getElementById('results');
const goBtn = document.getElementById('go');
let timer = null;

function fmt(t){ t=Number(t)||0; const m=Math.floor(t/60), s=(t%60); return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0'); }
// LLM/기법 문자열은 innerHTML로 들어가므로 반드시 이스케이프(< 포함 시 잘림/주입 방지)
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeUrl(u){ return (typeof u==='string' && /^https?:\/\//i.test(u)) ? u : ''; }
function num(x){ return Number.isFinite(Number(x)) ? Number(x) : 0; }

// 페이지 로드 시 한 번 받아두는 기법 목록(라벨 셀렉트용)
let TECHNIQUES = [];
fetch('/techniques').then(r => r.json()).then(d => { TECHNIQUES = d || []; })
  .catch(() => { TECHNIQUES = []; });

// "01:23.45" 또는 "83.45" 형태를 초 단위 float로 파싱. 빈 값/잘못된 값은 null.
function parseTime(s){
  s = String(s||'').trim();
  if (!s) return null;
  if (s.includes(':')) {
    const parts = s.split(':');
    if (parts.length !== 2) return null;
    const m = parseFloat(parts[0]), sec = parseFloat(parts[1]);
    if (!Number.isFinite(m) || !Number.isFinite(sec)) return null;
    return m * 60 + sec;
  }
  const v = parseFloat(s);
  return Number.isFinite(v) ? v : null;
}

// 마킹 영상의 현재 재생 시각을 manual labeler 입력칸에 채워넣음.
// 멀티모드(card+coin)에서는 manual labeler 카드 바로 앞쪽 모드 블록의 영상을 사용.
function useVideoTime(btn){
  const card = btn.closest('.card');
  let cur = card.previousElementSibling, video = null;
  while (cur && !video){
    const v = cur.querySelector('video');
    if (v) video = v;
    cur = cur.previousElementSibling;
  }
  if (!video) video = document.querySelector('video');  // 폴백
  const input = btn.closest('.labeler').querySelector('input.time-input');
  if (!video){ alert('영상이 없어 시점을 가져올 수 없어요.'); return; }
  const t = Number(video.currentTime) || 0;
  input.value = t.toFixed(2);
}

// 임의 시점 라벨 등록(탐지 못 한 구간 보완용). 시각 파싱 후 submitLabel 공통 흐름 재사용.
async function submitManualLabel(jobId, btn){
  const lab = btn.closest('.labeler');
  const timeStr = lab.querySelector('input.time-input').value;
  const peakSec = parseTime(timeStr);
  const sel = lab.querySelector('select');
  const free = lab.querySelector('input.tech-input');
  const msg = lab.querySelector('.msg');
  if (peakSec == null){
    msg.className = 'msg err';
    msg.textContent = '시각을 입력하세요 (예: 01:23.45 또는 83.45).';
    return;
  }
  const technique = (free.value.trim() || sel.value || '').trim();
  if (!technique){ msg.className = 'msg err'; msg.textContent = '기법을 선택하거나 입력하세요.'; return; }
  btn.disabled = true; msg.className = 'msg mut'; msg.textContent = '시그니처 추출 중...';
  try {
    const r = await fetch('/label', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ job_id: jobId, peak_sec: peakSec, technique })
    });
    const d = await r.json();
    if (d.ok){
      msg.className = 'msg ok';
      msg.textContent = `✓ 등록됨: ${d.name_ko} @ ${peakSec.toFixed(2)}s`;
    } else {
      msg.className = 'msg err'; msg.textContent = '실패: ' + (d.error || '알 수 없음');
    }
  } catch(e){
    msg.className = 'msg err'; msg.textContent = '오류: ' + e.message;
  } finally {
    btn.disabled = false;  // 임의 시점은 여러 번 등록 가능(다른 시각·다른 기법)
  }
}

// 한 모드 결과 카드 안에 들어갈 manual labeler 블록.
function manualLabelerHtml(jobId){
  const opts = TECHNIQUES.map(t => `<option value="${esc(t.en)}">${esc(t.ko)} (${esc(t.type)})</option>`).join('');
  return `<div class="card">
    <h3>📌 임의 시점 라벨링</h3>
    <p class="mut" style="margin-top:0">탐지가 놓친 시점이 있다면 직접 시각과 기법을 지정해 추가하세요.</p>
    <div class="labeler" style="border:0;padding:0">
      <input type="text" class="time-input" placeholder="시각 (01:23.45 또는 83.45)" style="width:180px">
      <button type="button" onclick="useVideoTime(this)" style="background:#2b2f3a">▶ 현재 영상 시점</button>
      <select>${opts ? '<option value="">— 기법 선택 —</option>'+opts : '<option value="">기법 목록 로딩...</option>'}</select>
      <input type="text" class="tech-input" placeholder="또는 직접 입력" style="flex:1;min-width:120px">
      <button type="button" onclick="submitManualLabel('${esc(jobId)}', this)">라벨 등록</button>
      <span class="msg mut" style="font-size:.85rem;flex-basis:100%"></span>
    </div>
  </div>`;
}

// 의심 시점에 사용자가 직접 기법 라벨을 붙여 라이브러리에 등록(active learning).
async function submitLabel(jobId, peakSec, btn){
  const wrap = btn.closest('.labeler-wrap');
  const seg = wrap.closest('.seg');
  const sel = seg.querySelector('.labeler select');
  const free = seg.querySelector('.labeler input[type=text]');
  const msg = seg.querySelector('.labeler .msg');
  const summary = wrap.querySelector('summary');
  const technique = (free.value.trim() || sel.value || '').trim();
  if (!technique){ msg.className = 'msg err'; msg.textContent = '기법을 선택하거나 입력하세요.'; return; }
  btn.disabled = true; msg.className = 'msg mut'; msg.textContent = '시그니처 추출 중...';
  try {
    const r = await fetch('/label', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ job_id: jobId, peak_sec: peakSec, technique })
    });
    const d = await r.json();
    if (d.ok) {
      msg.className = 'msg ok';
      msg.textContent = `✓ 등록됨: ${d.name_ko} @ ${peakSec.toFixed(2)}s`;
      // 등록 성공 시 summary에 결과 표기 + 시각적 강조
      wrap.classList.add('registered');
      summary.textContent = `✓ 라벨 등록됨: ${d.name_ko}`;
    } else {
      msg.className = 'msg err'; msg.textContent = '실패: ' + (d.error || '알 수 없음');
      btn.disabled = false;
    }
  } catch (e){
    msg.className = 'msg err'; msg.textContent = '오류: ' + e.message;
    btn.disabled = false;
  }
}

// segment의 라벨러 HTML — 기본은 접힘. summary 클릭 시 펼쳐져 라벨 입력 가능.
function labelerHtml(jobId, peakSec){
  const opts = TECHNIQUES.map(t => `<option value="${esc(t.en)}">${esc(t.ko)} (${esc(t.type)})</option>`).join('');
  return `<details class="labeler-wrap"><summary>기법 라벨링</summary>
    <div class="labeler">
      <span class="mut" style="font-size:.85rem">이 시점 기법:</span>
      <select>${opts ? '<option value="">— 선택 —</option>'+opts : '<option value="">기법 목록 로딩...</option>'}</select>
      <input type="text" placeholder="또는 직접 입력" style="flex:1;min-width:120px">
      <button type="button" onclick="submitLabel('${esc(jobId)}', ${num(peakSec)}, this)">라벨 등록</button>
      <span class="msg mut" style="font-size:.85rem"></span>
    </div>
  </details>`;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!form.querySelector('input[name="mode"]:checked')) {
    alert('마술 종류를 하나 이상 선택하세요 (카드/동전).');
    return;
  }
  resultsEl.innerHTML = '';
  goBtn.disabled = true;
  statusBox.style.display = 'block';
  const spin = statusBox.querySelector('.spin');
  if (spin) spin.style.display = '';   // 새 시작 시 스피너 복원
  statusText.textContent = '업로드/시작 중…';
  logEl.textContent = '';
  try {
    const res = await fetch('/analyze', { method:'POST', body:new FormData(form) });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '시작 실패');
    poll(data.job_id);
  } catch (err) {
    statusText.textContent = '오류: ' + err.message;
    goBtn.disabled = false;
  }
});

function poll(jobId){
  statusText.textContent = '분석 중…';
  const modeKo = (m) => m === 'coin' ? '🪙 동전' : (m === 'auto' ? '🔮 자동 판별' : '🃏 카드');
  timer = setInterval(async () => {
    const r = await fetch('/status/' + jobId);
    const d = await r.json();
    if (d.log) logEl.textContent = d.log;
    if (d.status === 'running') {
      statusText.textContent = `분석 중… ${modeKo(d.mode)}${d.progress ? ' ('+d.progress+')' : ''}`;
      return;
    }
    clearInterval(timer);
    goBtn.disabled = false;
    if (d.status === 'failed') {
      const sp = statusBox.querySelector('.spin'); if (sp) sp.style.display = 'none';
      statusText.textContent = '분석 실패 (아래 로그 확인)';
      return;
    }
    statusBox.style.display = 'none';
    render(jobId, d);
  }, 2500);
}

function modeLabel(m, auto){ const b = m === 'coin' ? '🪙 동전 분석' : '🃏 카드 분석'; return auto ? b + ' (🔮 자동 판별)' : b; }

// 한 모드의 결과 묶음을 HTML로 렌더링. 파일 URL은 /jobs/<id>/<seg>/ 아래에서 가져온다.
// seg는 폴더명(auto일 수 있음), mode는 판별된 실제 종류(card/coin).
function renderMode(jobId, r){
  const rep = r.report || {};
  const segs = rep.segments || [];
  const base = `/jobs/${jobId}/${r.seg || r.mode}`;
  const isAuto = (r.seg === 'auto');
  let html = `<div class="card" style="border-left:3px solid var(--accent)">
    <h2 style="margin:0">${modeLabel(r.mode, isAuto)} <span class="mut" style="font-size:.9rem">· 의심 ${segs.length}개 · 길이 ${fmt(rep.duration_sec||0)}</span></h2></div>`;

  if (r.summary) {
    html += `<div class="card"><h3>🤖 전체 트릭 추정 (에이전트)</h3>
      <div class="infer" style="white-space:pre-wrap">${esc(r.summary)}</div></div>`;
  }

  if (r.techniques && r.techniques.length) {
    html += `<div class="card"><h3>🎓 사용된 기법 설명</h3>`;
    r.techniques.forEach(t => {
      const url = safeUrl(t.reference_url);
      const en = t.name_en ? ` ${esc(t.name_en)}` : '';
      html += `<div class="seg">
        <div class="head"><span>${esc(t.name_ko)} <span class="mut">${en}${t.type?' · '+esc(t.type):''}</span></span></div>
        <div style="margin:6px 0">${esc(t.desc)}</div>
        ${t.cues ? `<div class="mut" style="font-size:.85rem">관찰 단서: ${esc(t.cues)}</div>` : ''}
        ${url ? `<a href="${esc(url)}" target="_blank" rel="noopener"
           style="display:inline-block;margin-top:8px;color:#7db4ff">▶ 참고 튜토리얼 영상 보기</a>` : ''}
      </div>`;
    });
    html += `</div>`;
  }

  if (r.matches && r.matches.length) {
    html += `<div class="card"><h3>🔍 라이브러리 매칭 (데이터 기반 유사도)</h3>
      <p class="mut" style="margin-top:0">의심 순간의 손 궤적을 기법 예시 라이브러리와 비교한 결과(0~1).</p>`;
    r.matches.forEach(m => {
      html += `<div class="seg"><div class="head"><span>${fmt(m.time_sec)}</span></div>`;
      (m.results||[]).forEach(rr => {
        const sim = num(rr.similarity);
        const pct = Math.max(0, Math.min(100, Math.round(sim*100)));
        html += `<div style="display:flex;align-items:center;gap:8px;margin:4px 0">
          <span style="width:130px">${esc(rr.name_ko)}</span>
          <span style="flex:1;background:#0d0f14;border-radius:6px;overflow:hidden;height:14px">
            <span style="display:block;height:100%;width:${pct}%;background:var(--ok)"></span></span>
          <span class="mut" style="width:48px;text-align:right">${sim.toFixed(2)}</span>
        </div>`;
      });
      html += `</div>`;
    });
    html += `</div>`;
  }

  if (r.video) {
    html += `<div class="card"><h3>마킹 영상</h3>
      <video controls src="${base}/annotated.webm"></video></div>`;
  }

  // 탐지가 놓친 시점을 사람이 직접 라벨링 — 자동 탐지의 false negative 보완
  html += manualLabelerHtml(jobId);

  html += `<div class="card"><h3>의심 구간 타임라인</h3>`;
  if (!segs.length) html += `<p class="mut">의심 구간을 찾지 못했습니다.</p>`;
  segs.forEach((s, i) => {
    const badges = (s.top_signals||[]).map(x => `<span class="badge">${esc(x)}</span>`).join('');
    const score = (s.score==null) ? '-' : num(s.score).toFixed(2);
    html += `<div class="seg">
      <div class="head"><span>[${i+1}] ${fmt(s.start_sec)} ~ ${fmt(s.end_sec)}</span>
        <span class="mut">정점 ${fmt(s.peak_sec)} · 점수 ${score}</span></div>
      <div class="badges">${badges}</div>
      ${s.inference ? `<div class="infer">🤖 ${esc(s.inference)}</div>` : ''}
      ${labelerHtml(jobId, num(s.peak_sec))}
    </div>`;
  });
  html += `</div>`;

  if (r.frames && r.frames.length) {
    html += `<div class="card"><h3>의심 프레임</h3><div class="gallery">`;
    r.frames.forEach(f => {
      const m = f.match(/_([\d.]+)s\.jpg$/);
      html += `<figure><img src="${base}/${f}">
        <figcaption>${m ? fmt(parseFloat(m[1])) : f}</figcaption></figure>`;
    });
    html += `</div></div>`;
  }
  return html;
}

function render(jobId, d){
  const results = d.results || [];
  if (!results.length) { resultsEl.innerHTML = `<div class="card"><p class="mut">결과가 없습니다.</p></div>`; return; }
  resultsEl.innerHTML = results.map(r => renderMode(jobId, r)).join('');
}
</script>
</body>
</html>
